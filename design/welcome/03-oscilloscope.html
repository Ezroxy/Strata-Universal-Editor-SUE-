<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oscilloscope</title>
<link rel="stylesheet" href="../../css/fonts.css">
<script src="../../js/core/icons.js"></script>
<script src="common.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: Manrope, sans-serif; background: radial-gradient(ellipse at 50% 40%, #2a2d33, #121317 70%); color: #d9dde3; }
  .dev { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%); width: min(1260px, 92vw); height: min(720px, 84vh); border-radius: 28px; padding: 26px;
    background: linear-gradient(160deg, #3b3f46, #24272c 60%, #1c1e22); box-shadow: inset 0 1px 0 rgba(255,255,255,.15), inset 0 -2px 0 rgba(0,0,0,.5), 0 40px 80px rgba(0,0,0,.6), 0 0 0 1px #0d0e10;
    display: grid; grid-template-columns: 1fr 290px; grid-template-rows: 1fr auto; gap: 22px 26px; }
  .dev::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px); pointer-events: none; }
  .bezel { position: relative; border-radius: 22px; padding: 18px; background: linear-gradient(#141518, #0b0c0d); box-shadow: inset 0 3px 12px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08); }
  .crt { position: relative; width: 100%; height: 100%; border-radius: 14px / 18px; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #0b1a10, #030805 75%); box-shadow: inset 0 0 60px rgba(0,0,0,.95), inset 0 0 6px rgba(80,255,140,.2); }
  .crt canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .crt::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 18%, rgba(255,255,255,.07), transparent 45%), repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.18) 2px 3px); pointer-events: none; }
  .ro { position: absolute; font: 600 13px 'JetBrains Mono'; color: #7dffaa; text-shadow: 0 0 8px rgba(80,255,140,.75); letter-spacing: .06em; pointer-events: none; }
  .ro.tl { left: 22px; top: 16px; } .ro.tr { right: 22px; top: 16px; text-align: right; }
  .ro.bl { left: 22px; bottom: 18px; right: 22px; font-size: 14px; line-height: 1.7; transition: opacity .3s; }
  .ro.bl b { font-size: 22px; letter-spacing: .14em; }
  .ro .dim { opacity: .55; }
  .side { display: flex; flex-direction: column; gap: 16px; }
  .brand { padding: 4px 2px 10px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .brand .row { display: flex; align-items: center; gap: 12px; }
  .brand h1 { margin: 0; font: 800 22px Manrope; letter-spacing: .14em; color: #eef1f5; text-shadow: 0 1px 0 #000; }
  .brand small { display: block; font: 600 10px 'JetBrains Mono'; letter-spacing: .24em; color: #8b9099; margin-top: 6px; }
  .brand p { margin: 12px 0 0; font-size: 12.5px; color: #9ea4ad; line-height: 1.55; }
  .knobs { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 10px; padding: 6px 0; }
  .knob { display: flex; flex-direction: column; align-items: center; gap: 8px; font: 700 9.5px 'JetBrains Mono'; letter-spacing: .14em; color: #8f949c; }
  .knob i { width: 62px; height: 62px; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #6a6f78, #2c2f34 62%, #1b1d20); box-shadow: 0 6px 12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.2), 0 0 0 5px #17181b; position: relative; transition: transform .7s cubic-bezier(.2,1.2,.3,1); }
  .knob i::after { content: ''; position: absolute; left: 50%; top: 7px; width: 3px; height: 15px; margin-left: -1.5px; border-radius: 2px; background: #e8edf2; }
  .knob i::before { content: ''; position: absolute; inset: -12px; border-radius: 50%; background: repeating-conic-gradient(from -135deg, rgba(255,255,255,.35) 0 1deg, transparent 1deg 27deg); mask: radial-gradient(circle, transparent 41px, #000 42px); -webkit-mask: radial-gradient(circle, transparent 41px, #000 42px); }
  .panelbtns { margin-top: auto; display: flex; flex-direction: column; gap: 7px; }
  .pb { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 8px; background: linear-gradient(#41454c, #2e3136); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 2px 0 #121316, 0 3px 6px rgba(0,0,0,.4); font: 700 12px Manrope; color: #dfe3e8; cursor: pointer; border: 0; }
  .pb:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 0 0 #121316; }
  .pb kbd { margin-left: auto; font: 600 10px 'JetBrains Mono'; color: #8b9099; }
  .chans { grid-column: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .ch { position: relative; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px; cursor: pointer; background: linear-gradient(#383c42, #26292e); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 3px 0 #111214, 0 6px 14px rgba(0,0,0,.45); transition: transform .12s, box-shadow .12s; }
  .ch:hover { transform: translateY(1px); }
  .ch.on { transform: translateY(3px); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 0 0 #111214, 0 2px 6px rgba(0,0,0,.4); }
  .ch .led { width: 12px; height: 12px; border-radius: 50%; background: #333; box-shadow: inset 0 1px 2px rgba(0,0,0,.6); transition: background .2s, box-shadow .2s; flex: none; }
  .ch.on .led { background: var(--c); box-shadow: 0 0 12px var(--c), 0 0 3px #fff; }
  .ch b { font: 800 10px 'JetBrains Mono'; letter-spacing: .2em; color: #8b9099; display: block; }
  .ch span { font: 800 20px Manrope; letter-spacing: .08em; color: #eef1f5; }
  .ch .key { margin-left: auto; font: 700 11px 'JetBrains Mono'; color: #72777f; border: 1px solid #50545b; border-radius: 5px; padding: 2px 6px; }
  .foot { grid-column: 2; display: flex; align-items: center; justify-content: center; font: 600 9.5px 'JetBrains Mono'; letter-spacing: .2em; color: #6c7179; }
</style>
</head>
<body>
<div class="dev">
  <div class="bezel"><div class="crt"><canvas id="cv"></canvas>
    <div class="ro tl" id="tl">CH— · STRATA SS-3</div>
    <div class="ro tr" id="tr">TIME/DIV 1ms<br><span class="dim">TRIG ▲ AUTO</span></div>
    <div class="ro bl" id="bl"></div>
  </div></div>
  <div class="side">
    <div class="brand"><div class="row" id="logo"></div><p id="tag"></p></div>
    <div class="knobs" id="knobs"></div>
    <div class="panelbtns" id="pbs"></div>
  </div>
  <div class="chans" id="chans"></div>
  <div class="foot">MODEL SS-3 · SIGNAL STUDIO</div>
</div>
<script>
document.getElementById('logo').innerHTML = SW.logo(38) + `<div><h1>STRATA</h1><small>STUDIO · SIGNAL ANALYZER</small></div>`;
document.getElementById('tag').textContent = SW.tagline;
document.getElementById('pbs').innerHTML = SW.actions.map(([ic, l, k]) => `<button class="pb">${SW.icon(ic, 15)}${l}${k ? `<kbd>${k}</kbd>` : ''}</button>`).join('');
const KN = ['INTENSITY', 'FOCUS', 'TIME / DIV', 'VOLTS / DIV'];
document.getElementById('knobs').innerHTML = KN.map(k => `<div class="knob"><i></i>${k}</div>`).join('');
const knobs = [...document.querySelectorAll('.knob i')];
const chans = document.getElementById('chans');
SW.modes.forEach((m, i) => { chans.insertAdjacentHTML('beforeend', `<div class="ch" data-i="${i}" style="--c:${m.color}"><i class="led"></i><div><b>CH${i + 1}</b><span>${m.name.toUpperCase()}</span></div><span class="key">${i + 1}</span></div>`); });
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H;
const fit = () => { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); buildText(); };
// vector text: trace the outline of "STRATA" into one ordered beam path
let textPts = [];
function buildText() {
  const oc = document.createElement('canvas'), w = 900, h = 240; oc.width = w; oc.height = h;
  const o = oc.getContext('2d'); o.fillStyle = '#fff'; o.font = '900 190px Manrope, sans-serif'; o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillText('STRATA', w / 2, h / 2 + 8);
  const d = o.getImageData(0, 0, w, h).data, on = (x, y) => d[(y * w + x) * 4 + 3] > 128, pts = [];
  for (let y = 1; y < h - 1; y += 2) for (let x = 1; x < w - 1; x += 2) if (on(x, y) && (!on(x - 2, y) || !on(x + 2, y) || !on(x, y - 2) || !on(x, y + 2))) pts.push([x, y]);
  // greedy nearest-neighbour ordering → a continuous beam path
  const used = new Uint8Array(pts.length), out = []; let cur = 0; used[0] = 1; out.push(pts[0]);
  for (let n = 1; n < pts.length; n++) { let best = -1, bd = 1e9; const [cx, cy] = pts[cur]; for (let k = 0; k < pts.length; k++) if (!used[k]) { const dd = (pts[k][0] - cx) ** 2 + (pts[k][1] - cy) ** 2; if (dd < bd) { bd = dd; best = k; if (dd <= 8) break; } } used[best] = 1; out.push(pts[best]); cur = best; }
  const s = Math.min(W * 0.78 / w, H * 0.5 / h);
  textPts = out.map(([x, y]) => [W / 2 + (x - w / 2) * s, H * 0.42 + (y - h / 2) * s]);
}
addEventListener('resize', fit); document.fonts.load('800 190px Manrope').then(() => setTimeout(fit, 30));
let mode = -1, pos = 0, t = 0, lock = 0;
const signal = (m, x, tt) => {   // x in 0..1 → y offset in px (time-base traces)
  if (m === 1) return (Math.sin(x * 26 + tt * 3) * 0.55 + Math.sin(x * 61 - tt * 5) * 0.25 + Math.sin(x * 9 + tt) * 0.3) * H * 0.16 * (0.6 + 0.4 * Math.sin(tt * 1.3 + x * 4));
  // composite video: sync pulse, colour burst, luminance staircase (colour bars) — 2 lines across the screen
  const u = (x * 2) % 1;
  if (u < 0.06) return H * 0.18;                                   // sync tip
  if (u < 0.12) return Math.sin(u * 900 + tt * 20) * H * 0.03;     // burst
  const step = Math.floor((u - 0.12) / 0.88 * 7);
  return -H * (0.04 + step * 0.045) + Math.sin(u * 600 + tt * 40) * H * 0.012 * (step % 2 ? 1 : 0.4);
};
function draw() {
  t += 1 / 60;
  if (!W) return requestAnimationFrame(draw);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(2,8,4,0.2)'; ctx.fillRect(0, 0, W, H);          // phosphor persistence
  // graticule
  ctx.strokeStyle = 'rgba(80,255,140,.08)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 1; i < 10; i++) { ctx.moveTo(W * i / 10, 0); ctx.lineTo(W * i / 10, H); }
  for (let i = 1; i < 8; i++) { ctx.moveTo(0, H * i / 8); ctx.lineTo(W, H * i / 8); }
  ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  ctx.shadowColor = 'rgba(80,255,140,.9)'; ctx.shadowBlur = 10; ctx.lineCap = 'round';
  const col = mode < 0 ? '120,255,160' : ({ 0: '255,170,120', 1: '120,255,215', 2: '190,170,255' })[mode];
  ctx.strokeStyle = `rgba(${col},.8)`; ctx.lineWidth = 2;
  if (mode < 0 && textPts.length) {
    // draw a slice of the vector text each frame, like a real XY beam
    const n = textPts.length, per = Math.ceil(n / 2.2);
    ctx.beginPath();
    for (let k = 0; k < per; k++) { const a = textPts[(pos + k) % n], b = textPts[(pos + k + 1) % n]; if ((a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 < 60) { ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); } }
    ctx.stroke(); pos = (pos + per) % n;
    // a faint sweep line under the name
    ctx.strokeStyle = `rgba(${col},.35)`; ctx.beginPath(); ctx.moveTo(W * 0.1, H * 0.7); for (let x = 0; x <= 1; x += 0.005) ctx.lineTo(W * (0.1 + x * 0.8), H * 0.7 + Math.sin(x * 40 + t * 4) * 6 * Math.sin(x * Math.PI)); ctx.stroke();
  } else if (mode === 2) {
    // Lissajous figure, slowly drifting phase
    ctx.beginPath();
    const a = 3, b = 2, ph = t * 0.6, R = Math.min(W, H) * 0.33;
    for (let k = 0; k <= 720; k++) { const s = k / 720 * Math.PI * 2; const x = W / 2 + Math.sin(a * s + ph) * R * 1.35, y = H * 0.42 + Math.sin(b * s) * R * 0.9; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  } else {
    ctx.beginPath();
    for (let k = 0; k <= 400; k++) { const x = k / 400; const y = H * 0.42 + signal(mode, x, t); k ? ctx.lineTo(x * W, y) : ctx.moveTo(x * W, y); }
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
const tl = document.getElementById('tl'), tr = document.getElementById('tr'), bl = document.getElementById('bl');
const idle = () => { bl.innerHTML = `<span class="dim">NO INPUT SELECTED</span><br>SELECT A CHANNEL — CH1 VIDEO · CH2 AUDIO · CH3 IMAGE`; };
idle();
function setMode(i) {
  mode = i;
  document.querySelectorAll('.ch').forEach((c, k) => c.classList.toggle('on', k === i));
  knobs.forEach((k, n) => { k.style.transform = `rotate(${i < 0 ? [-40, 20, 0, 60][n] : [-40 + i * 50, 20 - i * 35, i * 60 - 50, 60 - i * 40][n]}deg)`; });
  if (i < 0) { tl.textContent = 'CH— · STRATA SS-3'; tr.innerHTML = 'TIME/DIV 1ms<br><span class="dim">TRIG ▲ AUTO</span>'; return idle(); }
  const m = SW.modes[i];
  tl.textContent = `CH${i + 1} · ${m.name.toUpperCase()} · ${['COMPOSITE', '500mV/div', 'X–Y MODE'][i]}`;
  tr.innerHTML = `${['TIME/DIV 20µs', 'TIME/DIV 1ms', 'X–Y 3:2'][i]}<br><span class="dim">TRIG ▲ CH${i + 1}</span>`;
  bl.innerHTML = `<b>${m.name.toUpperCase()}</b> <span class="dim">— ${m.desc}</span><br>${m.pts.map(p => '▸ ' + p).join('&nbsp;&nbsp; ')}`;
}
setMode(-1);
document.querySelectorAll('.ch').forEach(c => {
  const i = +c.dataset.i;
  c.addEventListener('mouseenter', () => setMode(i));
  c.addEventListener('mouseleave', () => setMode(-1));
  c.addEventListener('click', () => SW.choose(SW.modes[i].id));
});
SW.keys();
</script>
</body>
</html>
