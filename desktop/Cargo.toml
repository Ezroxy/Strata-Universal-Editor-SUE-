[package]
name = "strata-studio"
version = "0.1.0"
edition = "2024"

[dependencies]
tao = "0.37.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
wry = "0.57.0"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = "s"     # small and fast to load; the heavy lifting happens in WebView2
lto = true
codegen-units = 1
panic = "abort"
strip = true
